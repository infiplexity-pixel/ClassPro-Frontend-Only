version: '3.8'
services:
  goscraper:
    build: .
    container_name: goscraper-js
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
      - NODE_ENV=${NODE_ENV:-production}
      - URL=${URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    restart: unless-stopped
